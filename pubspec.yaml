name: facebook
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  provider: ^6.0.5
  video_player: ^2.7.1
  carousel_slider: ^5.1.2 # 4.2.1 colidia com o CarouselController nativo do Flutter 3.24+
  webview_flutter: ^4.2.4
  smooth_video_progress: ^0.0.4

  # --- Feed Efêmero Local-First / E2EE ---
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1
  get: ^4.6.6
  supabase_flutter: ^2.3.4
  libsignal_protocol_dart: ^0.8.1
  uuid: ^4.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/reactions/
    - assets/images/user/
    - assets/images/post/
    - assets/images/story/
    - assets/videos/
    - assets/images/menu/
    - assets/images/nav/
